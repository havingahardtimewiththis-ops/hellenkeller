    <p>A framed work consists of the following elements:</p>

    <ol>
      <li id="glass">
        <h2>Glass</h2>

        <p>
          At Amazon’s three kinds of glass are used. The first is an
          extremely cheap glass which they buy in large panes and cut at
          the shop. It costs 21.000 CLP (≈18€) for a sheet of 150 × 200 cm.
        </p>

        <p>
          The second is what is referred to as “museum glass”, called so
          because of its conservative qualities (mostly UV protection).
          The specific grade of museum glass at Amazonas is 70% non-reflective.
          A pane of museum glass costs around 120.000 CLP (≈100€). Museum
          glass is generally ordered pre-cut to avoid mistakes.
        </p>

        <p>
          The third type of glass is a kind of mat glass which I guess is
          used for its non-reflective qualities. This glass does, however,
          have an issue: it cannot be used if the work is meant to have any
          kind of distance to the glass, because the work then appears
          blurred, and is therefore not used very often. I do not know how
          much it costs.
        </p>
      </li>

      <li id="the-frame">
        <h2>The frame</h2>

        <p>
          Frames are generally locally sourced woods (Raulí and Pine) which
          are shaped and sent to the shop in 3 meter strands. Generally
          speaking, the thinner the frame the “better”, because a frame is
          meant to “dissappear”, something I had not expected from Amazonas,
          given that they are known for extravagant displays.
        </p>

        <p>
          The black frame comes pre-painted and coated in a kind of plaster,
          which is a problem since it is almost impossible to fix if it is
          knocked over or knicked while cutting it. Black frames are the
          most popular option.
        </p>

        <p>
          Amazonas has the luxury of offering Nielsen Aluminum frames.
          Nielsen seem to have a bit of a monopoly on the aluminium frame,
          charging exorbitant amounts just for the license to sell their
          particular profile. Last time I checked it was around 8000€.
          The shop with the license sends the frames pre-cut to Amazonas.
        </p>

        <p>
          All frames are cut 2 mm wider than the glass. All wood frames are
          glued together with fast drying wood glue and then joined together
          with an angle joiner. There is no need to use acid free glue since
          the glue will not touch the work. Fast drying wood glue is used
          because time and space are scarce.
        </p>
      </li>

      <li id="paspartout-foamboard">
        <h2>Paspartout / foamboard</h2>

        <p>
          This is in a way the most exciting part of framing because it is
          the thing that builds the space around the piece. Given that the
          same material is used for architectural models there is a kind of
          aura to it. Different layers and spacings create thin 3 dimensional
          spaces behind glass.
        </p>

        <p>
          A classic paspartout is a folder with the hole cut in front of it
          that covers just about 3 mm of the edge of the work that is
          glued/taped to the back. If the work “floats” a separate invisible
          piece is stuck to the back of the work, usually taped with acid
          free tape in case of paper and sewn in the case of fabric.
        </p>

        <p>

                row.appendChild(textBtn);

                // / video (only for projects with video)
                if (project.videoId) {
                    row.appendChild(createSep());
                    const videoBtn = document.createElement("button");
                    videoBtn.className = "nav-link";
                    videoBtn.textContent = "video";
                    videoBtn.onclick = () => toggleSection(project.id, "video");
                    row.appendChild(videoBtn);
                }

                item.appendChild(row);

                // Dropdown container
                const dropdown = document.createElement("div");
                dropdown.className = "project-dropdown";
                dropdown.id = `dropdown-${project.id}`;
                item.appendChild(dropdown);

                container.appendChild(item);
            });
        }

        function createSep() {
            const span = document.createElement("span");
            span.className = "sep";
            span.textContent = "/";
            return span;
        }

        function toggleSection(projectId, section) {
            const currentActive = activeStates[projectId];
            const dropdown = document.getElementById(`dropdown-${projectId}`);
            const projectItem = document.getElementById(`project-${projectId}`);

            // Remove active style from all links in this project row
            const buttons = projectItem.querySelectorAll(".nav-link");
            buttons.forEach(btn => {
                if (btn.textContent.trim() === section && currentActive !== section) {
                    btn.classList.add("active");
                } else {
                    btn.classList.remove("active");
                }
            });

            if (currentActive === section) {
                // Collapse
                activeStates[projectId] = null;
                dropdown.className = "project-dropdown";
                dropdown.innerHTML = "";
                return;
            }

            // Open section
            activeStates[projectId] = section;
            dropdown.className = "project-dropdown active";
            dropdown.innerHTML = "";

            const project = projects.find(p => p.id === projectId);
            if (!project) return;

            if (section === "images") {
                const thumbContainer = document.createElement("div");
                thumbContainer.className = "thumbnails-container";
                project.images.forEach(imgUrl => {
                    const img = document.createElement("img");
                    img.src = imgUrl;
                    img.alt = project.name;
                    img.className = "thumbnail-img";
                    img.setAttribute("referrerpolicy", "no-referrer");
                    img.onclick = () => openLightbox(imgUrl);
                    thumbContainer.appendChild(img);
                });
                dropdown.appendChild(thumbContainer);
            } else if (section === "text") {
                const a4Wrapper = document.createElement("div");
                a4Wrapper.className = "a4-wrapper";
                dropdown.appendChild(a4Wrapper);
                paginateA4(project.text, a4Wrapper);
            } else if (section === "video") {
                const vidContainer = document.createElement("div");
                vidContainer.className = "video-container";

                // Responsive 16:9 container with official embed and direct link fallback
                vidContainer.innerHTML = `
                    <div class="video-responsive-wrapper">
                        <iframe 
                            src="https://www.youtube.com/embed/${project.videoId}?rel=0&playsinline=1" 
                            title="${project.name} Video" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" 
                            allowfullscreen="true">
                        </iframe>
                    </div>
                    <div class="video-footer">
                        <a href="https://www.youtube.com/watch?v=${project.videoId}" target="_blank" rel="noopener noreferrer" class="youtube-direct-link">Watch on YouTube ↗</a>
                    </div>
                `;
                dropdown.appendChild(vidContainer);
            }
        }

        // Decompose DOM tree into atomic printable units
        function extractUnits(node) {
            const units = [];

            function walk(n) {
                if (n.nodeType !== Node.ELEMENT_NODE) return;
                const tag = n.tagName.toUpperCase();

                // Structural containers are unpacked into their children
                if (tag === 'ARTICLE' || tag === 'SECTION' || tag === 'DIV' || tag === 'MAIN') {
                    Array.from(n.children).forEach(child => walk(child));
                } else if (tag === 'OL' || tag === 'UL') {
                    // Unpack list items so long lists can flow across pages
                    let index = parseInt(n.getAttribute('start')) || 1;
                    Array.from(n.children).forEach(child => {
                        if (child.tagName && child.tagName.toUpperCase() === 'LI') {
                            units.push({
                                type: 'li',
                                listTag: tag,
                                index: index,
                                node: child.cloneNode(true)
                            });
                            index++;
                        } else {
                            walk(child);
                        }
                    });
                } else {
                    // Block units: P, BLOCKQUOTE, H1, H2, H3, etc.
                    units.push({
                        type: 'block',
                        node: n.cloneNode(true)
                    });
                }
            }

            Array.from(node.children).forEach(child => walk(child));
            return units;
        }

        // Automatic A4 Pagination Engine - Guarantees no empty pages and continuous text flow
        function paginateA4(htmlContent, container) {
            container.innerHTML = "";

            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = htmlContent.trim();

            const units = extractUnits(tempDiv);
            if (units.length === 0) return;

            let currentPage = createA4Page();
            container.appendChild(currentPage);

            let currentList = null;

            units.forEach(unit => {
                let appendedElement = null;

                if (unit.type === 'li') {
                    if (!currentList || currentList.parentElement !== currentPage || currentList.tagName !== unit.listTag) {
                        currentList = document.createElement(unit.listTag);
                        if (unit.listTag === 'OL') {
                            currentList.setAttribute('start', unit.index);
                        }
                        currentPage.appendChild(currentList);
                    }
                    appendedElement = unit.node.cloneNode(true);
                    currentList.appendChild(appendedElement);
                } else {
                    currentList = null;
                    appendedElement = unit.node.cloneNode(true);
                    currentPage.appendChild(appendedElement);
                }

                // Check if page overflows printable boundary
                // NEVER evict if currentPage has only this element (prevents empty pages)
                const hasPreviousContent = (currentPage.children.length > 1) || 
                    (currentList && currentList.children.length > 1);

                if (hasPreviousContent && currentPage.scrollHeight > currentPage.clientHeight) {
                    // Remove overflowing element from current page
                    if (unit.type === 'li') {
                        currentList.removeChild(appendedElement);
                        if (currentList.children.length === 0) {
                            currentPage.removeChild(currentList);
                        }
                    } else {
                        currentPage.removeChild(appendedElement);
                    }

                    // Create next page
                    currentPage = createA4Page();
                    container.appendChild(currentPage);
                    currentList = null;

                    // Append onto fresh new page
                    if (unit.type === 'li') {
                        currentList = document.createElement(unit.listTag);
                        if (unit.listTag === 'OL') {
                            currentList.setAttribute('start', unit.index);
                        }
                        currentPage.appendChild(currentList);
                        currentList.appendChild(unit.node.cloneNode(true));
                    } else {
                        currentPage.appendChild(unit.node.cloneNode(true));
                    }
                }
            });
        }

        function createA4Page() {
            const page = document.createElement("div");
            page.className = "a4-page";
            return page;
        }

        // Lightbox Functions (No Frame, No Shadow)
        function openLightbox(src) {
            const overlay = document.getElementById("lightbox");
            const img = document.getElementById("lightbox-img");
            img.src = src;
            overlay.classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            const overlay = document.getElementById("lightbox");
            overlay.classList.remove("active");
            document.getElementById("lightbox-img").src = "";
            document.body.style.overflow = "auto";
        }

        // Close lightbox on Escape key
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                closeLightbox();
            }
        });

        // Initial render
        renderProjects();
    </script>
</body>
</html>
